<!doctype html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker TEST v447</title><style>body{font:16px system-ui;background:#f1f5f9;margin:0;padding:16px}.box{max-width:420px;margin:auto;background:white;padding:20px;border-radius:16px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:6px 0;border-radius:9px;border:1px solid #ccc;font:inherit}button{background:#1d4ed8;color:white;border:0}button:disabled{background:#94a3b8}#msg{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#475569}</style></head><body><main class="box"><h2>Worker TEST v447</h2><p>Жасалма кызматкер гана. GPS алынбайт. Негизги табелге жазылбайт.</p><section id="login"><input id="email" type="email" placeholder="TEST админ email"><input id="password" type="password" placeholder="Сырсөз"><button id="signin">Кирүү</button></section><section id="setup" hidden><input id="pin" inputmode="numeric" maxlength="4" placeholder="Тест кызматкеринин PIN"><button id="start">Тестти баштоо</button></section><section id="actions" hidden><p id="who"></p><button data-type="in">Жумушка келдим</button><button data-type="lunch_out">Обедке кеттим</button><button data-type="lunch_in">Обедден келдим</button><button data-type="out">Жумуштан кеттим</button><ol id="history"></ol></section><button id="exit" hidden>Чыгуу</button><p id="msg" role="status"></p><small>TEST гана • v447 • өзүнчө тест журналы</small></main><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script>
const app=firebase.initializeApp({
    apiKey: "AIzaSyAws1PfcVA1AOg1ToquJVs05FBg0kPE1E8",
    authDomain: "gps-tracker-test-d97dc.firebaseapp.com",
    databaseURL: "https://gps-tracker-test-d97dc-default-rtdb.firebaseio.com",
    projectId: "gps-tracker-test-d97dc",
    appId: "1:894193046205:web:6b06231416f0f4eb5f9dd4"
  },'worker-button-test-v447');
const auth=app.auth(),db=app.database(),uid='N9LwkUA3ePaqLWaPh6B4HzavTJT2';
const $=id=>document.getElementById(id), seq=['in','lunch_out','lunch_in','out'];
const buttons=[...document.querySelectorAll('[data-type]')];let run=null,step=0,busy=false;
function msg(s){$('msg').textContent=s}function allowed(){return auth.currentUser?.uid===uid}function norm(s){return String(s||'').normalize('NFKC').trim().replace(/\s+/g,' ').toUpperCase()}
function render(){buttons.forEach((b,i)=>b.disabled=busy||i!==step||!allowed());$('start').disabled=busy;$('signin').disabled=busy;$('exit').disabled=busy;}
async function task(fn){if(busy)return;busy=true;render();try{await fn()}catch(e){msg('Ката: '+(e.code?e.code+' — ':'')+e.message)}finally{busy=false;render()}}
$('signin').onclick=()=>task(async()=>{await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);$('password').value='';if(!allowed()){await auth.signOut();throw Error('TEST администратору гана уруксат')}msg('TEST админ кирди')});
auth.onAuthStateChanged(u=>{const ok=allowed();$('login').hidden=ok;$('setup').hidden=!ok||!!run;$('exit').hidden=!ok;if(!ok){run=null;step=0;$('actions').hidden=true;}render()});
$('start').onclick=()=>task(async()=>{if(!allowed())throw Error('Авторизация керек');const pin=$('pin').value.trim();if(!/^\d{4}$/.test(pin))throw Error('4 орундуу PIN керек');const p=(await db.ref('test/pins/'+pin).get()).val();if(!p||norm(p.name)!=='ТЕСТ КЫЗМАТКЕР NO1')throw Error('Тест кызматкер №1 гана уруксат');if(!['TEST','ТЕСТ'].includes(norm(p.bolum)))throw Error('TEST бөлүмү дал келбейт');const ref=db.ref('test/workerButtonTests').push();await ref.set({synthetic:true,createdAt:firebase.database.ServerValue.TIMESTAMP,step:0});run=ref;step=0;$('history').replaceChildren();$('who').textContent='Тест кызматкер №1 / TEST';$('setup').hidden=true;$('actions').hidden=false;msg('Төрт баскычты кезеги менен басыңыз')});
buttons.forEach(b=>b.onclick=()=>task(async()=>{if(!allowed()||!run||b.dataset.type!==seq[step])throw Error('Окуянын кезеги туура эмес');const i=step,type=seq[i];const before=(await run.get()).val();if(!before||before.synthetic!==true||before.step!==i)throw Error('TEST журналындагы кадам дал келбейт');const result=await run.transaction(v=>{if(!v||v.synthetic!==true||v.step!==i)return;v.events=v.events||{};v.events[type]={type,time:firebase.database.ServerValue.TIMESTAMP};v.step=i+1;return v});if(!result.committed)throw Error('Транзакция токтотулду: күтүлгөн кадам '+i+', базадагы кадам '+String(result.snapshot.val()?.step));step=result.snapshot.val().step;const li=document.createElement('li');li.textContent=b.textContent+' — сакталды';$('history').append(li);msg(step===4?'Төрт тесттик окуя сакталды.':'Окуя сакталды: '+type)}));
$('exit').onclick=()=>task(async()=>{await auth.signOut();msg('Сессия жабылды')});render();
</script></body></html>
