<!doctype html><html lang="ky"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEST — Обед v447</title><style>body{font:16px system-ui;background:#f1f5f9;margin:20px}main{max-width:480px;margin:auto;background:white;padding:20px;border-radius:14px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;font:inherit}button{background:#1d4ed8;color:white;border:0;border-radius:8px}button:disabled{opacity:.5}small{color:#475569} [hidden]{display:none!important}</style><main><h2>TEST — Обед v447</h2><p>Жасалма кызматкер гана. GPS алынбайт.</p><form id="login"><input id="email" type="email" placeholder="TEST админ email" required><input id="password" type="password" placeholder="Сырсөз" required><button>Кирүү</button></form><section id="panel" hidden><p>Тест кызматкер №1 / TEST</p><input id="pin" inputmode="numeric" maxlength="4" placeholder="Тест кызматкеринин PIN"><button id="run">Тесттик окуяларды жазуу</button><button id="logout">Чыгуу</button><small>График базадан алынат. Обедге 2 мүнөт эрте чыгуу жана 2 мүнөт кеч келүү текшерилет. Келечектеги окуялар жазылбайт.</small></section><p id="status" role="status"></p></main><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script>
'use strict';
const $=id=>document.getElementById(id), say=s=>$('status').textContent=s;
const app=firebase.initializeApp({apiKey:'AIzaSyAws1PfcVA1AOg1ToquJVs05FBg0kPE1E8',authDomain:'gps-tracker-test-d97dc.firebaseapp.com',databaseURL:'https://gps-tracker-test-d97dc-default-rtdb.firebaseio.com',projectId:'gps-tracker-test-d97dc',appId:'1:894193046205:web:6b06231416f0f4eb5f9dd4'},'lunch-test-v447');
const auth=app.auth(),db=app.database(),uid='N9LwkUA3ePaqLWaPh6B4HzavTJT2';
const authorized=()=>auth.currentUser?.uid===uid;
auth.onAuthStateChanged(()=>{$('panel').hidden=!authorized();$('login').hidden=authorized();});
$('login').onsubmit=async e=>{e.preventDefault();try{await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);if(!authorized()){await auth.signOut();throw Error('TEST админ гана');}say('TEST админ кирди');}catch(e){say(e.message)}finally{$('password').value=''}};
$('logout').onclick=()=>auth.signOut();
const norm=x=>String(x??'').normalize('NFKC').replace(/\s+/g,' ').trim().toLowerCase().replace(/№\s*/g,'no ');
const mins=t=>/^\d{2}:\d{2}$/.test(t||'')?Number(t.slice(0,2))*60+Number(t.slice(3)):NaN;
const valid=s=>s&&Array.isArray(s.workDays)&&['start','lunchS','lunchE','end'].every(k=>Number.isFinite(mins(s[k]))&&mins(s[k])<1440&&Number(s[k].slice(3))<60)&&mins(s.start)+2<mins(s.lunchS)&&mins(s.lunchS)<mins(s.lunchE)&&mins(s.lunchE)+2<mins(s.end);
async function eventsFor(now,pin,p){const day=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Bishkek',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);const [w,d,f]=await Promise.all(['test/workerSchedules/'+pin,'test/deptSchedules/'+encodeURIComponent(p.bolum),'test/settings/defaultSchedule'].map(async path=>(await db.ref(path).get()).val()));const c=w||{},t=c.temporary;const s=t&&t.from<=day&&day<=t.to&&valid(t.schedule)?t.schedule:c.mode==='custom'&&valid(c.permanent)?c.permanent:(!c.mode||c.mode==='legacy')&&valid(p.schedule)?p.schedule:valid(d)?d:f;if(!valid(s))throw Error('Жарактуу график табылган жок');if(!s.workDays.map(Number).includes(new Date(day+'T12:00:00+06:00').getUTCDay()))throw Error('Эс алуу күнү');const base=Date.parse(day+'T00:00:00+06:00');return [['in',mins(s.start)],['lunch_out',mins(s.lunchS)-2],['lunch_in',mins(s.lunchE)+2],['out',mins(s.end)]].map(([type,m])=>({type,time:base+m*60000,day})).filter(e=>e.time<=now.getTime());}
$('run').onclick=async()=>{if(!authorized())return;const pin=$('pin').value.trim();if(!/^\d{4}$/.test(pin)){say('4 орундуу тест PIN керек');return;}$('run').disabled=true;try{const p=(await db.ref('test/pins/'+pin).get()).val();if(!p)throw Error('PIN TEST базасында табылган жок');if(norm(p.name)!==norm('Тест кызматкер №1'))throw Error('Тест кызматкеринин аты дал келбейт');if(norm(p.bolum)!=='test')throw Error('TEST бөлүмү дал келбейт');const events=await eventsFor(new Date(),pin,p);if(!events.length)throw Error('График боюнча биринчи окуянын убактысы келе элек');const id='synthetic_lunch_'+pin+'_'+events[0].day;const updates={};for(const e of events){updates['test/attendance/'+id+'_'+e.type]={type:e.type,time:e.time,pin,workerId:id,name:p.name,bolum:p.bolum,deptId:String(p.deptId||1),synthetic:true};}if(!authorized())throw Error('Авторизация жок');await db.ref().update(updates);say('Тесттик окуялар сакталды: '+events.map(e=>e.type).join(', '));}catch(e){say('Ката: '+e.message)}finally{$('run').disabled=false}};
</script></html>
